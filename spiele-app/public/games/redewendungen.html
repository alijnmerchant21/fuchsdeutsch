<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tomaten auf den Augen</title>
<style>
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(../fonts/figtree.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(../fonts/figtree-ext.woff2) format("woff2");unicode-range:U+0100-024F,U+1E00-1EFF}

:root{
  --ink:#4a453f; --soft:#8b847a; --paper:#fffdf7; --line:#e6dfcf; --bg:#f7f3e8;
  --peach:#f6b9a4; --peach-d:#e58f74; --sky:#bcd9f2; --sky-d:#7fb0dc; --mint:#c5e6c8; --mint-d:#8fc497;
  --lilac:#d7c9ec; --lilac-d:#a993d1; --butter:#f3e2a0; --butter-d:#d9c165; --rose:#f5c6d6; --rose-d:#e09bb3;
  --tomato:#f19b87; --tomato-d:#d9715c;
  --shadow:0 10px 30px -12px rgba(90,80,60,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);user-select:none;line-height:1.4}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
.e{display:block;font-size:.8em;font-style:italic;font-weight:400;color:var(--soft);margin-top:2px;line-height:1.3}
body:not(.en-on) .e{display:none}

/* ---------- studio backdrop ---------- */
#studio{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#fff6ea 0%,#f9e7e4 40%,#efe3f3 70%,#e6e1f2 100%);pointer-events:none}
#bgimg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.2s}
#bgimg.ok{opacity:.5}
#studio::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,253,247,.55),rgba(255,253,247,.25) 40%,rgba(247,243,232,.75))}
.curtain{position:absolute;top:-2%;bottom:18%;width:11vw;min-width:46px;background:repeating-linear-gradient(90deg,#f2b8b2 0 14px,#e9a39c 14px 22px,#f5c4be 22px 34px);box-shadow:inset -10px 0 24px rgba(160,70,60,.25);opacity:.75;z-index:1}
.curtain.l{left:0;border-bottom-right-radius:60% 30%;transform-origin:0 0;animation:sway 9s ease-in-out infinite}
.curtain.r{right:0;border-bottom-left-radius:60% 30%;transform:scaleX(-1);transform-origin:100% 0;animation:swayr 10s ease-in-out infinite}
@keyframes sway{50%{transform:skewX(1.6deg)}}
@keyframes swayr{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) skewX(1.6deg)}}
.valance{position:absolute;left:0;right:0;top:0;height:26px;background:radial-gradient(circle at 20px -6px,#f2b8b2 22px,transparent 23px) 0 0/40px 26px repeat-x;z-index:2;opacity:.85}
.beam{position:absolute;top:-10%;width:34vw;height:120%;background:conic-gradient(from 180deg at 50% 0%,transparent 168deg,rgba(255,248,214,.55) 176deg,rgba(255,248,214,.75) 180deg,rgba(255,248,214,.55) 184deg,transparent 192deg);transform-origin:50% 0;filter:blur(6px);mix-blend-mode:screen;z-index:1}
.beam.b1{left:4%;animation:beam 11s ease-in-out infinite}
.beam.b2{right:4%;animation:beam 13s ease-in-out infinite reverse}
@keyframes beam{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.floor{position:absolute;left:-10%;right:-10%;bottom:0;height:22vh;transform-origin:50% 100%;transform:perspective(600px) rotateX(55deg);background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 2px,transparent 2px 70px),linear-gradient(#efd9cc,#e3c8b8);box-shadow:0 -20px 60px rgba(255,255,255,.7) inset;opacity:.9}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,240,190,.9);animation:twinkle 3s ease-in-out infinite;opacity:.0;z-index:1}
@keyframes twinkle{50%{opacity:.9;transform:scale(1.4)}}

/* ---------- app shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:3}
.hud{display:flex;align-items:center;gap:10px;padding:12px 16px;flex:0 0 auto}
.board{display:flex;gap:8px;flex:1;min-width:0;overflow:hidden}
.chip{display:flex;align-items:center;gap:8px;min-width:0;background:rgba(255,253,247,.88);backdrop-filter:blur(6px);border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:0 4px 14px rgba(90,80,60,.08);transition:transform .3s cubic-bezier(.2,1.4,.4,1),border-color .3s,box-shadow .3s}
.chip.on{border-color:var(--cd);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent),0 6px 18px rgba(90,80,60,.14);transform:translateY(1px) scale(1.03)}
.chip .av{flex:0 0 30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:800;font-size:14px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--cd)}
.chip .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:120px}
.chip b{font-size:18px;font-variant-numeric:tabular-nums;font-weight:800}
.chip .fl{font-size:13px;font-weight:800;color:var(--tomato-d);white-space:nowrap}
.chip.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{40%{transform:scale(1.12)}}
.iconbtn{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,253,247,.88);border:1.5px solid var(--line);box-shadow:0 4px 14px rgba(90,80,60,.08);transition:transform .15s}
.iconbtn:hover{transform:translateY(-2px)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}

/* ---------- question layout ---------- */
.q{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:22px;align-items:start;padding-top:6px}
.colL,.colR{display:flex;flex-direction:column;gap:14px;min-width:0}
.tagrow{display:flex;align-items:center;gap:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-weight:800;font-size:14px;letter-spacing:.02em;background:var(--paper);border:1.5px solid var(--line);box-shadow:0 3px 10px rgba(90,80,60,.07)}
.tag.m{background:#fde9e3;border-color:#f3c6b8}
.tag.s{background:#e4f0fb;border-color:#c3dcf2}
.tag.b{background:linear-gradient(120deg,#fff1b8,#ffd9c2,#f8cfe0);border-color:#ebcf86;animation:glint 2.4s ease-in-out infinite}
@keyframes glint{50%{box-shadow:0 0 0 4px rgba(255,225,140,.45),0 3px 10px rgba(90,80,60,.07)}}
.tag .e{display:inline;margin:0 0 0 4px}
body:not(.en-on) .tag .e{display:none}
.count{font-size:13px;font-weight:700;color:var(--soft);white-space:nowrap}
.tagrow .sp{flex:1}
.timer{position:relative;width:48px;height:48px;flex:0 0 48px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .tbg{stroke:rgba(74,69,63,.1)}
.timer .tfg{stroke:var(--mint-d);stroke-linecap:round;transition:stroke .3s}
.timer.warn .tfg{stroke:var(--tomato-d)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.timer.warn span{color:var(--tomato-d);animation:tick 1s steps(1) infinite}
@keyframes tick{50%{transform:scale(1.18)}}
.timer.off{display:none}

/* TV with marquee bulbs */
.tvwrap{perspective:1200px}
.tv{position:relative;border-radius:30px;padding:14px;background:radial-gradient(circle,#fffbe6 0 3px,rgba(255,251,230,.0) 4.5px) 0 0/22px 22px,linear-gradient(145deg,#f6dc93,#eac36c 55%,#e4b65e);box-shadow:0 26px 40px -22px rgba(120,80,30,.55),0 0 0 4px #fffdf7,0 0 0 6px rgba(217,193,101,.6),inset 0 2px 0 rgba(255,255,255,.6);transform-style:preserve-3d;transition:transform .35s ease-out;animation:tvin .7s cubic-bezier(.2,.9,.3,1.12) both}
.tv.chase{animation:tvin .7s cubic-bezier(.2,.9,.3,1.12) both,chase 1.2s steps(2) infinite}
@keyframes chase{to{background-position:11px 0,0 0}}
@keyframes tvin{from{transform:rotateX(-35deg) translateY(30px) scale(.92);opacity:0}}
.tv::after{content:"";position:absolute;inset:14px;border-radius:18px;background:linear-gradient(125deg,rgba(255,255,255,.28) 0,rgba(255,255,255,0) 32%);pointer-events:none}
.pic{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--g);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 -30px 60px rgba(90,60,40,.08)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s,filter .6s,transform .6s;-webkit-user-drag:none}
.pic.ok img{opacity:1}
.ph{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.ph::before,.ph::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.45)}
.ph::before{width:46%;aspect-ratio:1;left:-10%;top:-14%}
.ph::after{width:30%;aspect-ratio:1;right:-6%;bottom:-8%;background:rgba(255,255,255,.3)}
.ph .emo{position:relative;z-index:1;font-size:clamp(64px,11vw,112px);line-height:1;filter:drop-shadow(0 12px 14px rgba(90,60,40,.22));animation:bob 3.2s ease-in-out infinite;letter-spacing:-.05em}
.ph .stage{position:absolute;left:18%;right:18%;bottom:9%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(90,60,40,.18),transparent)}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.pic.ok .ph{visibility:hidden}
.pic.blur img{filter:blur(22px) saturate(1.3);transform:scale(1.15)}
.pic.blur .ph .emo{filter:blur(14px)}
.peek{position:absolute;left:50%;bottom:16px;translate:-50% 0;z-index:3;background:rgba(255,253,247,.94);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:800;font-size:14px;box-shadow:0 8px 18px -8px rgba(90,80,60,.4);text-align:center;white-space:nowrap}
.peek .e{display:block;font-size:11px}
.peek:hover{transform:translateY(-2px)}
.sitcard{aspect-ratio:4/3;border-radius:18px;background:linear-gradient(150deg,#eaf3fc,#f3eefb 60%,#fdf0ea);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:22px 26px;text-align:center;position:relative;overflow:hidden}
.sitcard::before{content:"“";position:absolute;left:14px;top:-18px;font-size:150px;font-weight:900;color:rgba(127,176,220,.25);line-height:1}
.sitcard .emo{font-size:46px;animation:bob 3.2s ease-in-out infinite}
.sitcard p{margin:0;font-size:clamp(17px,2vw,21px);font-weight:600;line-height:1.4;position:relative}
.sitcard p .e{font-size:.78em;margin-top:6px}

.title{margin:0;font-size:clamp(24px,3.2vw,34px);line-height:1.15;font-weight:800;letter-spacing:.005em;animation:rise .5s .1s both}
.title.small{font-size:clamp(20px,2.4vw,26px)}
.sub{margin:-6px 0 0;color:var(--soft);font-size:14px}
.gap{display:inline-block;height:.85em;vertical-align:-.08em;border-bottom:4px dashed var(--tomato);margin:0 .14em;border-radius:2px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{border-color:var(--butter-d)}}
.gapfill{color:var(--tomato-d);background:#fde9e3;padding:0 .25em;border-radius:8px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

.dlg{display:flex;flex-direction:column;gap:10px;animation:rise .5s .2s both}
.bub{position:relative;max-width:88%;background:var(--paper);border:1.5px solid var(--line);border-radius:20px 20px 20px 6px;padding:9px 14px 10px;box-shadow:0 6px 16px -10px rgba(90,80,60,.4);font-size:15.5px;animation:rise .45s both}
.bub:nth-child(2){align-self:flex-end;border-radius:20px 20px 6px 20px;background:#f4f9ff;border-color:#d6e6f5;animation-delay:.25s}
.bub:nth-child(3){animation-delay:.45s}
.bub .who{display:block;font-size:12px;font-weight:800;color:var(--tomato-d);letter-spacing:.03em;text-transform:uppercase;margin-bottom:1px}
.bub:nth-child(2) .who{color:var(--sky-d)}
.hint{font-size:14px;color:var(--soft);background:rgba(255,253,247,.75);border-radius:14px;padding:9px 14px;border:1.5px dashed var(--line)}

.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px 13px 12px;border-radius:18px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line),0 10px 20px -14px rgba(90,80,60,.4);font-size:16px;font-weight:600;transition:transform .12s,box-shadow .12s,border-color .15s,background .2s,opacity .3s;animation:optin .45s both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
@keyframes optin{from{opacity:0;transform:translateX(18px)}}
.opt .k{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--bg);border:1.5px solid var(--line);transition:.2s}
.opt .t{flex:1;min-width:0}
.opt .t .e{font-size:.82em}
@media(hover:hover){.opt:hover:not(:disabled){border-color:var(--peach);transform:translateY(-2px);box-shadow:0 6px 0 var(--peach),0 12px 22px -14px rgba(90,80,60,.4)}
.opt:hover:not(:disabled) .k{background:var(--peach);border-color:var(--peach-d)}}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt:disabled{cursor:default}
.opt.right{background:#e6f5e7;border-color:var(--mint-d);box-shadow:0 4px 0 var(--mint-d);animation:yay .6s cubic-bezier(.2,1.6,.4,1)}
.opt.right .k{background:var(--mint-d);border-color:var(--mint-d);color:#fff}
.opt.wrong{background:#fde8ee;border-color:var(--rose-d);box-shadow:0 4px 0 var(--rose-d);animation:nope .45s}
.opt.wrong .k{background:var(--rose-d);border-color:var(--rose-d);color:#fff}
.opt.dim{opacity:.5}
.opt.gone{opacity:.25;filter:grayscale(1);pointer-events:none;transform:scale(.97)}
@keyframes yay{40%{transform:scale(1.04)}}
@keyframes nope{20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.joker{padding:9px 16px;border-radius:999px;background:var(--lilac);font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--lilac-d);transition:.12s}
.joker:hover:not(:disabled){transform:translateY(-2px)}
.joker:disabled{opacity:.4;cursor:default;box-shadow:none}
.keys{font-size:12px;color:var(--soft)}

/* ---------- reveal sheet ---------- */
.sheet{position:fixed;left:50%;bottom:12px;width:min(660px,calc(100% - 20px));translate:-50% 0;z-index:8;background:var(--paper);border:1.5px solid var(--line);border-radius:28px;box-shadow:0 30px 70px -20px rgba(90,80,60,.5);padding:18px 20px 18px;transform:translateY(calc(100% + 140px));visibility:hidden;transition:transform .5s cubic-bezier(.2,1.1,.3,1),visibility 0s .5s;max-height:calc(100% - 80px);overflow-y:auto}
.sheet.show{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,1.1,.3,1),visibility 0s}
.sheet .top{display:flex;align-items:center;gap:12px}
.sheet .top h3{margin:0;font-size:24px;font-weight:800;line-height:1.1}
.sheet .top .pts{margin-left:auto;font-weight:800;font-size:22px;color:#3f8a55;white-space:nowrap}
.sheet .parts{font-size:12.5px;color:var(--soft);margin:2px 0 0}
.host{width:62px;height:62px;flex:0 0 62px}
.sheet.good .top h3{color:#3f8a55}
.sheet.bad .top h3{color:var(--tomato-d)}
.sbody{display:flex;gap:14px;margin-top:12px;align-items:flex-start}
.sbody .thumb{flex:0 0 150px;border-radius:16px;padding:6px;background:linear-gradient(145deg,#f6dc93,#e4b65e);box-shadow:0 10px 20px -12px rgba(120,80,30,.6)}
.sbody .thumb .pic{border-radius:11px}
.sbody .thumb .ph .emo{font-size:46px}
.stext{flex:1;min-width:0}
.stext h4{margin:0 0 4px;font-size:19px;font-weight:800;line-height:1.2}
.stext .mean{margin:0 0 6px;font-weight:700}
.stext .mean small{display:block;font-weight:600;color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stext .ex{margin:0 0 8px;font-size:14.5px;color:#5d574f}
.engl{display:inline-flex;gap:8px;align-items:center;background:#eef5fc;border:1.5px solid #d6e6f5;border-radius:12px;padding:6px 12px;font-size:14.5px;font-weight:600}
.engl small{font-weight:800;color:var(--sky-d);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.trap{display:inline-block;margin:0 0 8px;font-size:13px;font-weight:700;background:#fff3c9;border-radius:999px;padding:3px 10px}
.big{width:100%;padding:15px;border-radius:18px;background:var(--peach);font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--peach-d);transition:.12s;margin-top:14px}
.big:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--peach-d)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--peach-d)}
.big .e{color:#7a5a4e}
.ghost{width:100%;padding:12px;border-radius:16px;border:1.5px solid var(--line);margin-top:10px;font-weight:700;background:#fff}
.ghost:hover{border-color:var(--peach)}
#veil{position:fixed;inset:0;z-index:7;background:rgba(247,243,232,.35);opacity:0;pointer-events:none;transition:opacity .4s}
#veil.show{opacity:1;pointer-events:auto}

/* host mascot */
.host .mh,.host .ms,.host .mo{display:none}
.host.happy .mh,.host.sad .ms,.host.wow .mo{display:inline}
.host.happy{animation:hop .7s cubic-bezier(.2,1.6,.4,1)}
.host.sad{animation:droop .8s ease-in-out}
@keyframes hop{40%{transform:translateY(-12px) rotate(-6deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes droop{40%{transform:rotate(8deg) translateY(3px)}}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:none;place-items:center;z-index:10;padding:16px;background:rgba(247,243,232,.6);backdrop-filter:blur(5px);overflow:auto}
.ov.show{display:grid}
.card{position:relative;background:var(--paper);border-radius:28px;border:1.5px solid var(--line);box-shadow:0 30px 70px -20px rgba(90,80,60,.35);width:min(560px,100%);padding:24px 24px 22px;text-align:center;animation:flip .6s cubic-bezier(.2,.9,.3,1.12)}
@keyframes flip{from{transform:perspective(1200px) rotateX(-60deg) translateY(40px);opacity:0}}
.card h1{font:800 clamp(28px,6vw,40px)/1.05 "Figtree",system-ui,sans-serif;letter-spacing:.02em;margin:6px 0 6px;text-transform:uppercase}
.card p{margin:6px 0;color:var(--soft)}
.card .hostbig{width:120px;height:120px;margin:-4px auto 0;display:block;animation:bob 3s ease-in-out infinite}
.seg{display:inline-flex;flex-wrap:wrap;justify-content:center;background:var(--bg);border-radius:999px;padding:4px;margin:6px 0 4px;gap:2px}
.seg button{padding:8px 16px;border-radius:999px;font-weight:700;font-size:15px;transition:.2s}
.seg button.sel{background:#fff;box-shadow:0 4px 12px rgba(90,80,60,.12)}
.names{display:grid;gap:8px;margin:10px 0 6px}
.names label{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:7px 12px;animation:rise .35s both}
.names i{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.names input{border:0;font:inherit;font-weight:600;color:inherit;flex:1;background:none;min-width:0;outline:none}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.how div{background:var(--bg);border-radius:16px;padding:10px 8px;font-size:13px;line-height:1.3}
.how b{display:block;font-size:22px;margin-bottom:2px}
.small{font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:var(--bg);border-radius:16px;padding:12px 6px}
.stats b{display:block;font:800 28px/1.1 "Figtree",system-ui,sans-serif}
.stats span{font-size:13px;color:var(--soft)}
.review{text-align:left;max-height:230px;overflow:auto;background:var(--bg);border-radius:16px;padding:6px 12px;margin:8px 0 4px}
.review li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.review li:last-child{border-bottom:0}
.review .ic{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;margin-top:1px}

const $=s=>document.querySelector(s);
const embedded=window.parent!==window;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const split=s=>s.split('|');
const E=t=>`<span class="e">${t}</span>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let sound=true,actx;
function beep(f=520,d=.08,type='sine',v=.06,delay=0){if(!sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const jingle=(fs,gap=.11,type='triangle')=>fs.forEach((f,i)=>beep(f,.16,type,.06,i*gap));
const best=()=>{try{return +localStorage.getItem('fds:redewendungen:best')||0}catch(e){return 0}};
const setBest=v=>{try{localStorage.setItem('fds:redewendungen:best',v)}catch(e){}};

/* picture loading with graceful fallback (pastel card with emoji) */
const imgState={};
const GRAD=['linear-gradient(150deg,#fde3da,#fbd0c4 55%,#f6c1b5)','linear-gradient(150deg,#e3f0fb,#cfe3f6 55%,#bcd9f2)','linear-gradient(150deg,#e6f5e7,#d2ebd4 55%,#c5e6c8)','linear-gradient(150deg,#efe8f8,#e1d6f1 55%,#d7c9ec)','linear-gradient(150deg,#fdf6d8,#f8ebb8 55%,#f3e2a0)','linear-gradient(150deg,#fdebf1,#f9d7e3 55%,#f5c6d6)'];
function imgOk(el){imgState[el.dataset.k]=true;el.parentNode.classList.add('ok')}
function imgNo(el){imgState[el.dataset.k]=false;el.parentNode.classList.add('no');el.remove()}
function pic(it,extra=''){
  const k=it.k,img=imgState[k]===false?'':`<img alt="" data-k="${k}" src="${IMG_DIR+k}.webp" onload="imgOk(this)" onerror="imgNo(this)" draggable="false">`;
  return `<div class="pic ${extra}${imgState[k]?' ok':''}" style="--g:${GRAD[it.n%GRAD.length]}"><div class="ph"><i class="stage"></i><span class="emo">${it.emo}</span></div>${img}</div>`;
}
function preload(k){if(k in imgState)return;imgState[k]=undefined;const i=new Image();i.onload=()=>imgState[k]=true;i.onerror=()=>imgState[k]=false;i.src=IMG_DIR+k+'.webp'}
{const b=new Image();b.onload=()=>{const el=$('#bgimg');el.style.backgroundImage=`url(${IMG_DIR}studio.webp)`;el.classList.add('ok')};b.src=IMG_DIR+'studio.webp'}

/* ---------- setup ---------- */
const TIME=25, PER={1:12,2:8,3:6};
const COLORS=[['#d7c9ec','#a993d1'],['#c5e6c8','#8fc497'],['#bcd9f2','#7fb0dc']];
let S={n:1,timed:true,names:['Spieler 1','Spieler 2','Spieler 3']};
{const q=new URLSearchParams(location.search).get('name');if(q)S.names[0]=q.slice(0,14)}
function setup(){
  const save=()=>$('#setup').querySelectorAll('input').forEach(i=>S.names[+i.dataset.i]=i.value.trim()||('Spieler '+(+i.dataset.i+1)));
  const render=()=>{
    const b=best();
    $('#setup').innerHTML=`${HOST('wow').replace('class="host wow"','class="host wow hostbig"')}
      <h1>Tomaten auf den Augen</h1>
      <p>Willkommen in der Rateshow! Was meint man wirklich, wenn man das sagt?${E('Welcome to the quiz show! What do people really mean when they say that?')}</p>
      <div class="how">
        <div><b>🖼️</b>Was bedeutet das?${E('Pick the real meaning. Watch out for the literal trap!')}</div>
        <div><b>🎬</b>Welche Redewendung passt?${E('Match the idiom to the situation.')}</div>
        <div><b>⭐</b>Bonus: Ergänze!${E('Complete the idiom for double points.')}</div>
      </div>
      <div class="seg" id="segN">${[1,2,3].map(n=>`<button data-n="${n}" class="${n===S.n?'sel':''}">${n===1?'👤 Allein':n+' Personen'}</button>`).join('')}</div>${E('Solo, or 2 to 3 players taking turns on one device')}
      <div class="names">${[...Array(S.n)].map((_,i)=>`<label style="animation-delay:${i*.06}s"><i style="background:${COLORS[i][0]}"></i><input maxlength="14" data-i="${i}" value="${esc(S.names[i])}" aria-label="Name ${i+1}"></label>`).join('')}</div>
      <div class="seg" id="segT"><button data-t="1" class="${S.timed?'sel':''}">⏱️ Mit Zeit</button><button data-t="0" class="${S.timed?'':'sel'}">🐢 Ohne Zeit</button></div>
      <p class="small">${PER[S.n]} Fragen pro Person. Schnell sein und Serien bringen Extrapunkte. Jede Person hat einen 50:50-Joker.${E(`${PER[S.n]} questions per person. Speed and streaks earn bonus points. Everyone gets one 50:50 joker.`)}</p>
      <button class="big" id="go">Show starten!${E('Start the show!')}</button>
      ${b?`<p class="small" style="margin-top:10px">Dein Rekord allein: <b>${b}</b> Punkte${E(`Your solo best: ${b} points`)}</p>`:''}`;
    $('#setup').querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>{save();S.n=+x.dataset.n;render();beep(660,.06,'triangle')});
    $('#setup').querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{save();S.timed=x.dataset.t==='1';render();beep(660,.06,'triangle')});
    $('#go').onclick=()=>{save();start()};
  };
  render();showOv('setupOv');
}
function showOv(id){document.querySelectorAll('.ov').forEach(o=>o.classList.toggle('show',o.id===id))}

/* ---------- game ---------- */
let G=null;
function mkQ(it,type,pi){
  let opts;
  if(type==='m')opts=shuffle(it.o.map((s,j)=>{const[t,en]=split(s);return{t,en,ok:j===0,kind:['ok','lit','near','x'][j]}}));
  else if(type==='s'){const others=shuffle(IDIOMS.filter(x=>x!==it&&!(it.grp&&x.grp===it.grp))).slice(0,3);opts=shuffle([it,...others]).map(x=>({t:x.i,en:x.en,ok:x===it}))}
  else opts=shuffle([it.g[1],...it.g[2]]).map(w=>({t:w,ok:w===it.g[1]}));
  return{it,type,pi,opts};
}
function start(){
  const pool=shuffle(IDIOMS),qs=[];let k=0;
  for(let r=0;r<PER[S.n];r++)for(let pi=0;pi<S.n;pi++)qs.push(mkQ(pool[k++],r%4===3?'b':r%4===2?'s':'m',pi));
  G={players:S.names.slice(0,S.n).map((name,i)=>({name,c:COLORS[i][0],cd:COLORS[i][1],score:0,correct:0,streak:0,best:0,joker:true})),qs,qi:0,phase:'hand',left:TIME,paused:false,locked:false,log:[]};
  $('#board').className='board n'+S.n;
  showOv(null);jingle([523,659,784,1047]);
  board();turn();
}
function board(){
  $('#board').innerHTML=G.players.map((p,i)=>`<div class="chip ${G.qs[G.qi]&&G.qs[G.qi].pi===i&&G.phase!=='over'?'on':''}" id="chip${i}" style="--c:${p.c};--cd:${p.cd}"><span class="av">${esc(p.name[0].toUpperCase())}</span><span class="nm">${esc(p.name)}</span><b>${p.score}</b>${p.streak>=2?`<span class="fl">🔥${p.streak}</span>`:''}</div>`).join('');
}
function turn(){
  const q=G.qs[G.qi];board();
  const nxt=G.qs[G.qi+1];if(nxt)preload(nxt.it.k);preload(q.it.k);
  if(S.n>1){
    const p=G.players[q.pi];G.phase='hand';
    $('#hand').innerHTML=`<div class="handav" style="--c:${p.c};--cd:${p.cd}">${esc(p.name[0].toUpperCase())}</div>
      <h1>${esc(p.name)} ist dran!</h1>
      <p>Gib das Gerät an ${esc(p.name)} weiter. Frage ${Math.floor(G.qi/S.n)+1} von ${PER[S.n]}.${E(`Pass the device to ${esc(p.name)}. Question ${Math.floor(G.qi/S.n)+1} of ${PER[S.n]}.`)}</p>
      <button class="big" id="readyBtn">Ich bin bereit!${E("I'm ready!")}</button>`;
    showOv('handOv');$('#readyBtn').onclick=()=>{showOv(null);ask()};beep(587,.1,'triangle');
  }else ask();
}
const TAGS={m:['🖼️ Was bedeutet das?','What does it mean?'],s:['🎬 Welche Redewendung passt?','Which idiom fits?'],b:['⭐ Bonusrunde: Ergänze!','Bonus: complete it, double points']};
function ask(){
  const q=G.qs[G.qi],it=q.it,p=G.players[q.pi];
  G.phase='q';G.left=TIME;G.locked=false;G.ticked=TIME;
  const num=Math.floor(G.qi/S.n)+1;
  const tv=q.type==='s'
    ?`<div class="sitcard"><span class="emo">🎬</span><p>${split(it.s)[0]}${E(split(it.s)[1])}</p></div>`
    :pic(it,q.type==='b'?'blur':'')+(q.type==='b'?`<button class="peek" id="peek">👀 Bild aufdecken<span class="e">Reveal picture: single points</span></button>`:'');
  const gapHTML=it.g[0].replace('___',`<span class="gap" style="width:${Math.max(2.6,it.g[1].length*.55).toFixed(1)}em"></span>`);
  const title=q.type==='m'?`<h2 class="title">„${it.i}“</h2>`
    :q.type==='s'?`<h2 class="title small">Was sagst du in dieser Situation?${E('What do you say in this situation?')}</h2>`
    :`<h2 class="title">${gapHTML}</h2>`;
  const extra=q.type==='m'?`<div class="dlg">${it.d.map(([w,de,en])=>`<div class="bub"><span class="who">${w}</span>${de}${E(en)}</div>`).join('')}</div>`
    :q.type==='b'?`<div class="hint">💡 Das Bild zeigt die Redewendung wörtlich. Aufdecken hilft, kostet aber den Bonus.${E('The picture shows the idiom literally. Revealing it helps but costs the bonus.')}</div>`
    :`<div class="hint">💡 Achte auf die Bedeutung, nicht auf die Wörter.${E('Focus on the meaning, not the words.')}</div>`;
  const opts=`<div class="opts" id="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span><span class="t">${o.t}${o.en?E(o.en):''}</span></button>`).join('')}</div>
    <div class="tools"><button class="joker" id="joker" ${p.joker?'':'disabled'}>✂️ 50:50 Joker</button><span class="keys">Tasten 1 bis 4 · J für Joker</span></div>`;
  const tag=`<div class="tagrow"><span class="tag ${q.type}">${TAGS[q.type][0]}${E(TAGS[q.type][1])}</span><span class="count">${S.n>1?esc(p.name)+' · ':''}${num}/${PER[S.n]}</span><span class="sp"></span>
    <div class="timer ${S.timed?'':'off'}" id="timer"><svg viewBox="0 0 48 48"><circle class="tbg" cx="24" cy="24" r="20"/><circle class="tfg" id="tfg" cx="24" cy="24" r="20" stroke-dasharray="125.66" stroke-dashoffset="0"/></svg><span id="tnum">${TIME}</span></div></div>`;
  $('#q').innerHTML=`<div class="colL"><div class="tvwrap"><div class="tv chase" id="tv">${tv}</div></div>${q.type==='m'?extra:''}</div><div class="colR">${tag}${title}${q.type!=='m'?extra:''}${opts}</div>`;
  $('#main').scrollTop=0;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j,b));
  $('#joker').onclick=joker;
  if($('#peek'))$('#peek').onclick=peek;
  board();beep(880,.08,'triangle');beep(1175,.1,'sine',.04,.08);
  G.last=performance.now();
}
function peek(){if(!G||G.locked)return;const q=G.qs[G.qi];q.peek=true;const pc=$('#tv .pic');pc&&pc.classList.remove('blur');$('#peek').remove();beep(700,.12,'sine')}
function joker(){
  if(!G||G.phase!=='q'||G.locked||G.paused)return;const q=G.qs[G.qi],p=G.players[q.pi];if(!p.joker)return;
  p.joker=false;$('#joker').disabled=true;
  const wrong=shuffle(q.opts.map((o,j)=>j).filter(j=>!q.opts[j].ok)).slice(0,2);
  wrong.forEach(j=>{const b=document.querySelector(`.opt[data-j="${j}"]`);b.classList.add('gone');b.disabled=true});
  jingle([392,523],.08,'square');
}
function answer(j,btn){
  if(!G||G.phase!=='q'||G.locked||G.paused)return;
  const q=G.qs[G.qi],p=G.players[q.pi],ok=j>=0&&q.opts[j].ok;
  if(j>=0&&q.opts[j]&&document.querySelector(`.opt[data-j="${j}"]`).disabled)return;
  G.locked=true;G.phase='wait';
  document.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.j;b.disabled=true;b.classList.add(q.opts[k].ok?'right':k===j?'wrong':'dim')});
  $('#tv').classList.remove('chase');
  if($('#peek'))$('#peek').remove();
  if(q.type==='b'){const pc=$('#tv .pic');pc&&pc.classList.remove('blur');const g=$('.title .gap');if(g)g.outerHTML=`<span class="gapfill">${q.it.g[1]}</span>`}
  let pts=0;const parts=[];
  if(ok){
    p.streak++;p.best=Math.max(p.best,p.streak);p.correct++;
    const mult=q.type==='b'&&!q.peek?2:1,spd=S.timed?Math.round(50*Math.max(0,G.left)/TIME):0,str=p.streak>=2?25*(Math.min(p.streak,5)-1):0;
    parts.push(`Richtig +${100*mult}`);if(spd)parts.push(`Tempo +${spd*mult}`);if(str)parts.push(`🔥 Serie +${str}`);if(mult>1)parts.push('Bonus x2');
    pts=100*mult+spd*mult+str;p.score+=pts;
    const r=(btn||document.querySelector('.opt.right')).getBoundingClientRect();
    floatTxt(r.left+r.width/2,r.top-8,'+'+pts,'#3f8a55');burst(r.left+r.width/2,r.top+r.height/2);
    jingle(p.streak>=3?[659,784,988,1319]:[659,784,1047],.08);
  }else{
    p.streak=0;beep(196,.28,'sawtooth',.045);beep(147,.32,'triangle',.05,.12);
    if(!reduced)$('#q').animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(7px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:380});
  }
  G.log.push({it:q.it,ok,pi:q.pi,type:q.type});
  board();const ch=$('#chip'+q.pi);if(ch&&ok){ch.classList.remove('bump');void ch.offsetWidth;ch.classList.add('bump')}
  setTimeout(()=>sheet(q,j,ok,pts,parts),reduced?150:750);
}
function sheet(q,j,ok,pts,parts){
  const it=q.it,[mde,men]=split(it.o[0]),last=G.qi>=G.qs.length-1,ch=j>=0?q.opts[j]:null;
  const verdict=ok?(G.players[q.pi].streak>=3?['Grandios!','Brilliant!']:['Richtig!','Correct!']):j<0?['Zeit ist um!',"Time's up!"]:['Leider falsch!','Not quite!'];
  const trap=!ok&&ch&&ch.kind==='lit'?`<span class="trap">🍅 Reingefallen: Das war die wörtliche Bedeutung!${E('Gotcha: that was the literal meaning!')}</span>`
    :!ok&&ch&&ch.kind==='near'?`<span class="trap">🤏 Knapp daneben!${E('Close, but not quite!')}</span>`:'';
  const head=q.type==='b'?it.g[0].replace('___',`<span class="gapfill">${it.g[1]}</span>`):`„${it.i}“`;
  $('#sheet').className='sheet '+(ok?'good':'bad');
  $('#sheet').innerHTML=`<div class="top">${HOST(ok?'happy':'sad')}<div><h3>${verdict[0]}</h3>${E(verdict[1])}${ok?`<p class="parts">${parts.join(' · ')}</p>`:''}</div>${ok?`<span class="pts">+${pts}</span>`:''}</div>
    <div class="sbody"><div class="thumb">${pic(it)}</div><div class="stext">${trap}<h4>${head}</h4>
      <p class="mean"><small>Bedeutung</small>${mde}${E(men)}</p>
      <p class="ex">${it.ex}${E(it.exE)}</p>
      <span class="engl"><small>Englisch</small>${it.en}</span></div></div>
    <button class="big" id="nextBtn">${last?'Zum Ergebnis':'Weiter'}${E(last?'See results':'Next')}</button>`;
  $('#sheet').classList.add('show');$('#veil').classList.add('show');G.phase='sheet';
  $('#nextBtn').onclick=next;
}
function next(){
  if(!G||G.phase!=='sheet')return;
  $('#sheet').classList.remove('show');$('#veil').classList.remove('show');
  G.qi++;
  if(G.qi>=G.qs.length){end();return}
  G.phase='hand';setTimeout(turn,reduced?0:250);
}
function floatTxt(x,y,t,c){const f=document.createElement('div');f.className='ftext';f.textContent=t;f.style.left=x+'px';f.style.top=y+'px';f.style.color=c;document.body.appendChild(f);
  if(reduced){setTimeout(()=>f.remove(),800);return}
  f.animate([{transform:'translateY(0) scale(.6)',opacity:0},{transform:'translateY(-14px) scale(1.15)',opacity:1,offset:.25},{transform:'translateY(-60px) scale(1)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>f.remove()}
function burst(x,y){if(reduced)return;const s=document.createElement('div');s.className='burst';s.style.left=x+'px';s.style.top=y+'px';const cols=['#f19b87','#f3e2a0','#c5e6c8','#bcd9f2','#d7c9ec','#f5c6d6'];
  for(let i=0;i<14;i++){const p=document.createElement('i');p.style.background=cols[i%6];s.appendChild(p);const a=Math.PI*2*i/14,r=40+Math.random()*40;
    p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`,opacity:0}],{duration:650,easing:'cubic-bezier(.2,.8,.3,1)'})}
  document.body.appendChild(s);setTimeout(()=>s.remove(),700)}

/* timer loop */
function loop(now){
  if(G&&G.phase==='q'&&!G.paused&&!G.locked&&S.timed){
    const dt=Math.min(.1,(now-(G.last||now))/1000);G.left-=dt;
    const l=Math.max(0,G.left),tf=$('#tfg'),tn=$('#tnum'),tm=$('#timer');
    if(tf){tf.setAttribute('stroke-dashoffset',(125.66*(1-l/TIME)).toFixed(2));tn.textContent=Math.ceil(l);tm.classList.toggle('warn',l<=6)}
    const c=Math.ceil(l);if(c<G.ticked&&c<=5&&c>0)beep(c<=3?1046:880,.05,'square',.03);G.ticked=c;
    if(G.left<=0)answer(-1);
  }
  if(G)G.last=now;
  requestAnimationFrame(loop);
}

/* ---------- end ---------- */
function end(){
  G.phase='over';board();
  const me=G.players[0],xp=Math.min(100,me.correct*9);
  if(embedded&&xp>0)window.parent.postMessage({source:'fds-game',type:'xp',amount:xp},'*');
  const rank=G.players.slice().sort((a,b)=>b.score-a.score);
  const solo=S.n===1,b=best(),nb=solo&&me.score>b;if(nb)setBest(me.score);
  const per=PER[S.n],pct=me.correct/per;
  let head,pod='';
  if(solo){head=pct>=.9?['Redewendungs-Profi!','Idiom pro!']:pct>=.6?['Stark gemacht!','Great job!']:['Gut gespielt!','Well played!']}
  else{const tie=rank[0].score===rank[1].score;head=tie?['Unentschieden!',"It's a tie!"]:[`${esc(rank[0].name)} gewinnt!`,`${esc(rank[0].name)} wins!`];
    const order=rank.length===3?[1,0,2]:[1,0],H=[120,84,60],M=['🥇','🥈','🥉'];
    pod=`<div class="podium">${order.map(r=>{const p=rank[r];return`<div class="pod" style="--c:${p.c};--cd:${p.cd}"><span class="av" style="animation-delay:${.5+r*.15}s">${esc(p.name[0].toUpperCase())}</span><span class="nm">${esc(p.name)}</span><div class="blk" style="height:${H[r]}px;animation-delay:${r*.15}s"><span class="md">${M[r]}</span><span class="sc">${p.score}</span></div></div>`}).join('')}</div>`}
  const seen=new Set(),rev=G.log.filter(l=>!seen.has(l.it.k)&&seen.add(l.it.k));
  $('#endCard').innerHTML=`${HOST('happy').replace('class="host happy"','class="host happy hostbig"')}
    <h1>${head[0]}</h1>${E(head[1])}
    ${solo?(nb&&me.score>0?'<span class="newbest">Neuer Rekord! · New best!</span>':`<p>Rekord: ${Math.max(b,me.score)}</p>`):pod}
    ${solo?`<div class="stats"><div><b>${me.score}</b><span>Punkte</span></div><div><b>${me.correct}/${per}</b><span>richtig</span></div><div><b>${me.best}</b><span>beste Serie</span></div></div>`:
      `<div class="stats" style="grid-template-columns:repeat(${S.n},1fr)">${G.players.map(p=>`<div><b>${p.correct}/${per}</b><span>${esc(p.name)}<br>🔥 beste Serie ${p.best}</span></div>`).join('')}</div>`}
    ${xp?`<p><b>+${xp} XP</b> für ${solo?'deine richtigen Antworten':'die richtigen Antworten von '+esc(me.name)}.${E(`+${xp} XP for ${solo?'your':esc(me.name)+"'s"} correct answers.`)}</p>`:''}
    <p style="margin-top:12px"><b>Deine Redewendungen</b>${E('Idioms from this show')}</p>
    <ul class="review">${rev.map(l=>{const[m,me2]=split(l.it.o[0]);return`<li>${S.n>1?`<i class="who" style="background:${G.players[l.pi].cd}"></i>`:''}<span class="ic ${l.ok?'y':'n'}">${l.ok?'✓':'✗'}</span><span class="rt"><b>${l.it.i}</b><span>${m}</span>${E(l.it.en)}</span></li>`}).join('')}</ul>
    <button class="big" id="again">Nochmal!${E('Play again')}</button><button class="ghost" id="menu">Neue Spieler oder Einstellungen${E('New players or settings')}</button>`;
  setTimeout(()=>{showOv('endOv');$('#again').onclick=start;$('#menu').onclick=setup;if(G.log.some(l=>l.ok))confetti()},reduced?0:400);
  jingle([523,659,784,1047,1319],.12);
}
function confetti(){if(reduced)return;const cols=['#f19b87','#f3e2a0','#c5e6c8','#bcd9f2','#d7c9ec','#f5c6d6'];for(let i=0;i<90;i++){const c=document.createElement('i');c.className='conf';c.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%6]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),5200)}}

/* ---------- pause, input ---------- */
function pause(on){if(!G||G.phase==='over'||G.phase==='hand')return;if(on&&document.querySelector('.ov.show'))return;G.paused=on;$('#pauseOv').classList.toggle('show',on);G.last=performance.now()}
$('#pause').onclick=()=>pause(true);
$('#resume').onclick=()=>pause(false);
$('#quit').onclick=()=>{pause(false);$('#sheet').classList.remove('show');$('#veil').classList.remove('show');end()};
$('#snd').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔔':'🔕'};
addEventListener('blur',()=>{if(G&&G.phase==='q'&&!G.paused)pause(true)});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'){e.preventDefault();$('#go')&&$('#go').click()}return}
  const ov=document.querySelector('.ov.show');
  if(ov){if(e.key==='Enter'||e.key===' '){const b=ov.querySelector('.big');if(b){e.preventDefault();b.click()}}if(ov.id==='pauseOv'&&(e.key==='Escape'||e.key==='p'))pause(false);return}
  if(!G)return;
  if(G.phase==='sheet'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next();return}
  if(G.phase==='q'){
    const k={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];
    if(k!==undefined){e.preventDefault();answer(k,document.querySelector(`.opt[data-j="${k}"]`));return}
    if(e.key.toLowerCase()==='j'){joker();return}
  }
  if(e.key==='Escape'||e.key==='p')pause(true);
});
/* tilt the TV a little with the pointer for depth */
document.addEventListener('pointermove',e=>{if(reduced||e.pointerType!=='mouse')return;const tv=$('#tv');if(!tv)return;const r=tv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;if(Math.abs(x)>1.2||Math.abs(y)>1.2){tv.style.transform='';return}tv.style.transform=`rotateY(${x*6}deg) rotateX(${-y*5}deg)`});
/* English help is driven by the Fuchsdeutsch app around the game */
addEventListener('message',e=>{const m=e.data;if(m&&m.source==='fds-app'&&m.type==='en')document.body.classList.toggle('en-on',!!m.on)});
setup();
requestAnimationFrame(loop);
</script>
</body>
