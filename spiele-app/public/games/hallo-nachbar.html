<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hallo, Nachbar!</title>
<style>
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(../fonts/figtree.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(../fonts/figtree-ext.woff2) format("woff2");unicode-range:U+0100-024F,U+1E00-1EFF}

:root{
  --ink:#4a453f; --soft:#8b847a; --paper:#fffdf7; --line:#e6dfcf; --bg:#f7f3e8;
  --peach:#f6b9a4; --peach-d:#e58f74; --sky:#bcd9f2; --sky-d:#7fb0dc; --mint:#c5e6c8; --mint-d:#8fc495;
  --lilac:#d7c9ec; --lilac-d:#a993d1; --butter:#f3e2a0; --butter-d:#d9c165; --rose:#f5c6d6; --rose-d:#e09bb3;
  --a:#bcd9f2; --ad:#7fb0dc; --as:#eaf3fb; --aw:#dcebf8;
  --pc:#9cc8ee; --pcd:#5e97c9;
  --dh:360px; --dcx:50%; --bl:16px; --bw:300px; --bt:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Figtree",system-ui,sans-serif;color:var(--ink);background:var(--bg);user-select:none}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
button:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
.e{display:block;font-size:.78em;font-style:italic;font-weight:400;color:var(--soft);margin-top:2px}
body:not(.en-on) .e{display:none}
.ei{display:inline;margin:0}

/* ---------- scene ---------- */
#game{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip}
#bg{position:absolute;inset:0;overflow:hidden;background:var(--as);transition:background-color 1.1s}
#photo{position:absolute;inset:-2%;background-size:cover;background-position:50% var(--py,100%);opacity:0;transition:opacity .8s,background-position 1.4s cubic-bezier(.4,0,.2,1)}
#photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,253,247,.28),rgba(255,253,247,.04) 45%,rgba(247,243,232,.3))}
.has-bg #photo{opacity:1}
.hud{position:relative;z-index:6;flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px}
.pill{background:rgba(255,253,247,.88);backdrop-filter:blur(6px);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;box-shadow:0 4px 14px rgba(90,80,60,.08);display:flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .3s cubic-bezier(.2,1.6,.4,1),border-color .3s,box-shadow .3s}
.pill b{font-size:20px;font-variant-numeric:tabular-nums}
.pill .dot{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--cd);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;font-style:normal}
.pill .dot svg{width:30px;height:30px}
.pill.fox .dot{background:#fde5db;box-shadow:0 0 0 1.5px var(--peach-d);overflow:hidden}
.pill.on{border-color:var(--cd);box-shadow:0 0 0 3px rgba(255,255,255,.8),0 6px 16px rgba(90,80,60,.14);transform:translateY(-1px)}
.pill.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{40%{transform:scale(1.12)}}
.pill .pn{font-size:14px}
.sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,253,247,.88);border:1.5px solid var(--line);flex:none}
#rd svg{width:20px;height:20px}
#rd{padding-left:10px}

#stage{position:relative;flex:1;min-height:0;z-index:2;overflow:hidden}
#deco{position:absolute;inset:0;transition:opacity .6s;pointer-events:none}
.wall{position:absolute;inset:0;background:
  linear-gradient(0deg,transparent 9.6%,var(--ad) 9.6% 10.4%,var(--aw) 10.4% 37%,#fffaf0 37% 38.2%,rgba(0,0,0,.05) 38.2% 38.6%,transparent 38.6%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 2px,transparent 2px 72px) 0 100%/100% 9.6% no-repeat,
  linear-gradient(0deg,#e3d4b6 0,#ecdfc4 9.6%,transparent 9.6%);transition:background-color 1s}
.has-bg #deco{opacity:0}
.win{position:absolute;left:5%;top:9%;width:clamp(64px,11vw,150px);aspect-ratio:.62;border-radius:999px 999px 10px 10px;background:linear-gradient(180deg,#cfe6f8,#eaf4fb 70%,#fdf3e1);border:6px solid #fffaf0;box-shadow:0 10px 24px -12px rgba(90,80,60,.4),inset 0 0 0 2px rgba(0,0,0,.04);overflow:hidden}
.win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;translate:-50% 0;background:#fffaf0}
.win::after{content:"";position:absolute;left:0;right:0;top:55%;height:5px;background:#fffaf0}
.win i{position:absolute;width:46%;height:12%;border-radius:999px;background:#fff;top:22%;left:10%;animation:drift 18s ease-in-out infinite alternate}
.win i+i{top:40%;left:50%;width:34%;animation-duration:24s}
@keyframes drift{to{transform:translateX(40%)}}
.lamp{position:absolute;top:0;left:calc(var(--dcx) + var(--dh)*.28 + 58px);translate:-50% 0;width:60px;height:110px}
.lamp::before{content:"";position:absolute;left:50%;top:0;width:2px;height:62px;background:#bfb39d}
.lamp::after{content:"";position:absolute;left:8px;right:8px;top:60px;height:26px;border-radius:30px 30px 6px 6px;background:linear-gradient(180deg,#fff8e6,var(--butter));box-shadow:0 30px 60px 24px rgba(255,236,180,.55)}
.stairs{position:absolute;right:0;bottom:0;height:96%;width:auto;max-width:44%}
.plant{position:absolute;bottom:9%;left:calc(var(--dcx) - var(--dh)*.28 - var(--dh)*.32);width:calc(var(--dh)*.22);transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2deg)}}

#landing{position:absolute;inset:0}
.dw{position:absolute;left:var(--dcx);bottom:9%;height:var(--dh);width:calc(var(--dh)*.56);translate:-50% 0;perspective:1100px}
.casing{position:absolute;inset:-12px -13px 0 -13px;border-radius:8px 8px 0 0;background:linear-gradient(90deg,#f4ead6,#fffaf0 30%,#fffaf0 70%,#eadfc8);box-shadow:0 30px 40px -24px rgba(90,70,40,.5),0 0 0 1px rgba(90,70,40,.08),inset 0 2px 0 #fff}
.inside{position:absolute;inset:0;overflow:hidden;border-radius:2px;background:radial-gradient(120% 70% at 50% 25%,#fff4de,#ecd8b6 55%,#cdb28a);box-shadow:inset 0 14px 24px -6px rgba(80,60,30,.45),inset 0 0 0 2px rgba(80,60,30,.15)}
.inside::before{content:"";position:absolute;left:12%;right:12%;top:8%;height:30%;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.1));opacity:.6}
.who{position:absolute;left:3%;right:3%;bottom:0;aspect-ratio:3/4;transform-origin:50% 100%;transform:translateY(16%) scale(.84);opacity:0;transition:transform .75s cubic-bezier(.2,1.1,.3,1),opacity .5s}
.dw.open .who{opacity:1;transform:none;transition-delay:.25s}
.who.happy{animation:happy .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes happy{30%{transform:translateY(-5%) scale(1.03)}60%{transform:translateY(1%) scale(.99)}}
.who.huh{animation:huh .7s ease-in-out}
@keyframes huh{25%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
.pic{display:block;width:100%;height:100%;overflow:hidden}
.pic img,.pic svg{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.who .pic{border-radius:46% 46% 0 0/34% 34% 0 0}
.m2{display:none}
.huh .m1{display:none}.huh .m2{display:inline}
.door{position:absolute;inset:0;transform-origin:0 50%;transition:transform .95s cubic-bezier(.45,.05,.2,1),filter .95s;border-radius:2px;
  background:linear-gradient(90deg,var(--ad) 0,var(--a) 9%,var(--a) 91%,var(--ad));box-shadow:inset 0 0 0 2px rgba(0,0,0,.06),inset -8px 0 14px rgba(0,0,0,.07),0 1px 0 rgba(0,0,0,.05)}
.door.photo{background:var(--door-img) center/cover}
.door.photo>*:not(.knob){display:none}.door.photo .knob{display:none}
.dw.open .door{transform:rotateY(-108deg);filter:brightness(.9)}
.door .pn1,.door .pn2{position:absolute;left:15%;right:15%;border-radius:8px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.5),inset -3px -3px 0 rgba(0,0,0,.09),0 0 0 1px rgba(0,0,0,.04)}
.door .pn1{top:7%;height:38%}.door .pn2{top:52%;height:40%}
.door .peep{position:absolute;left:50%;top:30%;width:7%;aspect-ratio:1;translate:-50% 0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7d8,#c9a54c 60%,#8d6e25)}
.door .knob{position:absolute;right:8%;top:51%;width:10%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6cf,#dcb85c 55%,#a8832e);box-shadow:0 2px 3px rgba(0,0,0,.25)}
.door .knob::after{content:"";position:absolute;right:30%;top:35%;width:220%;height:32%;border-radius:999px;background:linear-gradient(180deg,#fff2c0,#c9a24a);box-shadow:0 2px 2px rgba(0,0,0,.2)}
.bell{position:absolute;left:calc(100% + 24px);top:44%;width:max(58px,calc(var(--dh)*.18));background:linear-gradient(160deg,#fff8e2,#ecd9a8);border-radius:8px;padding:5px 4px 7px;box-shadow:0 6px 12px -6px rgba(90,70,40,.5),inset 0 0 0 1px rgba(150,120,50,.35);text-align:center}
.bell b{display:block;font-size:max(10px,calc(var(--dh)*.032));font-weight:800;line-height:1.2;color:#6b5a32;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell i{display:block;width:16px;height:16px;margin:5px auto 0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f1dfaa 60%,#c9a54c);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.bell.ring i{animation:ring .25s 3}
@keyframes ring{50%{transform:scale(.8);box-shadow:0 0 0 6px rgba(255,220,130,.5)}}
.mat{position:absolute;top:calc(100% + 3px);left:6%;right:6%;height:5%;border-radius:8px;background:repeating-linear-gradient(90deg,var(--ad) 0 7px,var(--a) 7px 14px);box-shadow:0 6px 10px -4px rgba(90,70,40,.35);opacity:.9}
.spill{position:absolute;top:96%;left:-30%;right:-30%;height:16%;background:radial-gradient(closest-side,rgba(255,232,180,.9),transparent);opacity:0;transition:opacity .8s;pointer-events:none}
.dw.open .spill{opacity:1}
.ftag{position:absolute;bottom:calc(100% + 26px);left:50%;translate:-50% 0;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 6px 14px -8px rgba(90,80,60,.4);letter-spacing:.02em}
.ftag .e{display:inline;margin-left:4px}
body:not(.en-on) .ftag .e{display:none}

/* speech bubble */
#say{position:absolute;z-index:3;left:var(--bl);top:var(--bt);width:var(--bw);background:var(--paper);border:1.5px solid var(--line);border-radius:26px;padding:14px 18px 16px;box-shadow:0 22px 44px -18px rgba(90,80,60,.4),inset 0 2px 0 #fff;opacity:0;transform:translateY(10px) scale(.94);transform-origin:0 40%;transition:opacity .3s,transform .45s cubic-bezier(.2,1.4,.4,1)}
#say.show{opacity:1;transform:none}
#say::before{content:"";position:absolute;left:-11px;top:38px;width:20px;height:20px;background:var(--paper);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 5px}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nchip{background:var(--a);border-radius:999px;padding:3px 11px;font-weight:800;font-size:14px}
.role{font-size:13px;color:var(--soft);font-weight:600}
.ds{margin-left:auto;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff;opacity:0;transform:scale(.4);transition:.35s cubic-bezier(.2,1.6,.4,1)}
.ds.show{opacity:1;transform:none}
.spk{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.spk svg{width:18px;height:18px}
#line{font-size:clamp(19px,2.3vw,26px);font-weight:800;line-height:1.22;margin:8px 0 0;min-height:1.22em}
#lineEn{font-size:15px}

/* answer panel */
#panel{position:relative;z-index:5;flex:none;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(255,253,247,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1.5px solid var(--line);box-shadow:0 -16px 34px -24px rgba(90,80,60,.45)}
.pin{max-width:1100px;margin:0 auto}
.trow{display:flex;align-items:center;gap:12px;margin-bottom:10px;min-height:28px}
.turn{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;white-space:nowrap}
.turn .dot{width:20px;height:20px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--pcd)}
.turn .e{display:inline;margin-left:4px}
body:not(.en-on) .turn .e{display:none}
.timer{position:relative;flex:1;height:12px;border-radius:999px;background:#ece4d3;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.timer i{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--peach-d),var(--butter-d) 45%,var(--mint-d));transform-origin:0 50%;transform:scaleX(var(--t,1))}
.timer.late i{background:var(--peach-d);animation:late 1s ease-in-out infinite}
@keyframes late{50%{opacity:.55}}
.cpum{position:absolute;top:50%;width:30px;height:30px;translate:-50% -50%;border-radius:50%;background:#fde5db;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--peach-d),0 6px 12px -4px rgba(90,60,40,.4);overflow:hidden;display:none}
.cpum.show{display:block;animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
.cpum svg{width:100%;height:100%}
@keyframes pop{from{transform:scale(0)}}
.tlab{font-size:13px;font-weight:700;color:var(--soft);min-width:70px;text-align:right;white-space:nowrap}
#answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ans{position:relative;text-align:left;background:#fff;border:2px solid var(--line);border-radius:22px 22px 22px 6px;padding:11px 14px 11px 50px;font-weight:700;font-size:17px;line-height:1.25;min-height:60px;box-shadow:0 4px 0 var(--line),0 14px 22px -18px rgba(90,80,60,.6);transition:transform .15s,box-shadow .15s,background .25s,border-color .25s,opacity .35s}
.ans .k{position:absolute;left:12px;top:50%;translate:0 -50%;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--soft);transition:.25s}
.ans .e{font-size:13px}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pcd);box-shadow:0 6px 0 var(--pc),0 16px 24px -18px rgba(90,80,60,.6)}
.ans:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ans:disabled{cursor:default}
.ans.right{background:#ecf7ed;border-color:var(--mint-d);box-shadow:0 4px 0 var(--mint-d)}
.ans.right .k{background:var(--mint-d);color:#fff}
.ans.wrong{background:#fdeef3;border-color:var(--rose-d);box-shadow:0 4px 0 var(--rose-d);animation:nope .45s}
.ans.wrong .k{background:var(--rose-d);color:#fff}
.ans.dim{opacity:.42}
.ans.in{animation:ansin .5s cubic-bezier(.2,1.3,.4,1) both}
.ans.in:nth-child(2){animation-delay:.07s}.ans.in:nth-child(3){animation-delay:.14s}
@keyframes ansin{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes nope{20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#answers{position:relative}
#answers.wait .ans{opacity:0;pointer-events:none}
#answers.wait::after{content:"Hör gut zu …";position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-weight:700;font-size:15px;letter-spacing:.02em;animation:late 1.6s ease-in-out infinite}
body.en-on #answers.wait::after{content:"Hör gut zu …  ·  Listen closely"}

#hint{position:absolute;z-index:3;left:16px;right:16px;bottom:calc(100% + 12px);max-width:620px;margin:0 auto;background:var(--paper);border:2px solid var(--rose-d);border-radius:22px;padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 18px 36px -14px rgba(120,70,80,.4);opacity:0;transform:translateY(12px) scale(.97);pointer-events:none;transition:.3s cubic-bezier(.2,1.3,.4,1)}
#hint.show{opacity:1;transform:none;pointer-events:auto}
#hint .tx{flex:1;font-size:15px;line-height:1.35}
#hint .tx b{display:block;font-size:13px;color:var(--rose-d);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
#hint .cpu{display:block;font-size:13px;color:var(--soft);margin-top:4px}
.go{flex:none;padding:12px 18px;border-radius:16px;background:var(--peach);box-shadow:0 4px 0 var(--peach-d);font-weight:800;transition:.12s}
.go:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--peach-d)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--peach-d)}
.go .e{font-size:12px}
#rres{position:absolute;z-index:3;left:50%;bottom:calc(100% + 14px);translate:-50% 0;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:800;box-shadow:0 12px 26px -12px rgba(90,80,60,.45);white-space:nowrap;opacity:0;transform:translateY(10px) scale(.8);transition:.35s cubic-bezier(.2,1.5,.4,1);pointer-events:none;text-align:center}
#rres.show{opacity:1;transform:none}
#rres.won{border-color:var(--mint-d);background:#f1f9f1}
#rres .e{display:block;font-size:12px}

.ftext{position:absolute;pointer-events:none;z-index:7;font:800 28px/1 "Figtree",system-ui,sans-serif;white-space:nowrap;translate:-50% 0;text-shadow:0 2px 0 #fff,0 0 12px #fff}
.spark{position:absolute;pointer-events:none;z-index:7;font:800 22px/1 "Figtree",system-ui,sans-serif}
.wave{position:absolute;left:50%;top:40%;translate:-50% -50%;font:800 clamp(30px,6vw,56px)/1.05 "Figtree",system-ui,sans-serif;color:var(--ink);text-shadow:0 4px 0 #fff,0 0 24px rgba(255,255,255,.9);z-index:8;pointer-events:none;opacity:0;text-align:center;white-space:nowrap}
.wave.show{animation:wave 1.6s cubic-bezier(.2,1.2,.4,1) forwards}
.wave small{display:block;font:700 16px/1.4 "Figtree",system-ui,sans-serif;color:var(--soft);margin-top:6px}
@keyframes wave{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.05)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:none;place-items:center;z-index:10;padding:16px;background:rgba(247,243,232,.6);backdrop-filter:blur(5px);overflow:auto}
.ov.show{display:grid}
.card{position:relative;background:var(--paper);border-radius:28px;border:1.5px solid var(--line);box-shadow:0 30px 70px -20px rgba(90,80,60,.35);width:min(560px,100%);padding:24px 24px 22px;text-align:center;animation:flip .6s cubic-bezier(.2,.9,.3,1.12)}
@keyframes flip{from{transform:perspective(1200px) rotateX(-60deg) translateY(40px);opacity:0}}
.card h1{font:800 clamp(30px,6vw,42px)/1.05 "Figtree",system-ui,sans-serif;letter-spacing:.03em;margin:10px 0 6px;text-transform:uppercase}
.card p{margin:6px 0;color:var(--soft)}
.faces{display:flex;justify-content:center;margin:4px 0 2px;padding-left:14px}
.faces .f{width:62px;height:62px;border-radius:50%;margin-left:-14px;border:4px solid var(--paper);box-shadow:0 8px 16px -8px rgba(90,80,60,.5);overflow:hidden;background:var(--c);animation:bob 3s ease-in-out infinite}
.faces .f:nth-child(2){animation-delay:-.5s}.faces .f:nth-child(3){animation-delay:-1s}.faces .f:nth-child(4){animation-delay:-1.5s}.faces .f:nth-child(5){animation-delay:-2s}.faces .f:nth-child(6){animation-delay:-2.5s}
@keyframes bob{50%{transform:translateY(-6px)}}
.persona{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border-radius:18px;padding:10px 14px;margin:12px 0;font-size:14px}
.persona .tagb{flex:none;width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.persona .tagb svg{width:30px;height:30px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.how div{background:var(--bg);border-radius:16px;padding:10px 8px;font-size:13.5px}
.how b{display:block;font-size:22px;line-height:1.2;margin-bottom:2px}
.seg{display:inline-flex;flex-wrap:wrap;justify-content:center;background:var(--bg);border-radius:999px;padding:4px;margin:4px 0}
.seg button{padding:8px 16px;border-radius:999px;font-weight:700;font-size:15px}
.seg button.sel{background:#fff;box-shadow:0 4px 12px rgba(90,80,60,.14)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.names label{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px}
.names i{flex:none;width:20px;height:20px;border-radius:50%}
.names input{flex:1;min-width:0;font-weight:700;outline:none;user-select:text}
.big{width:100%;padding:15px;border-radius:18px;background:var(--peach);font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--peach-d);transition:.12s;margin-top:10px}
.big:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--peach-d)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--peach-d)}
.ghost{width:100%;padding:12px;border-radius:16px;border:1.5px solid var(--line);margin-top:10px;font-weight:700;background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:var(--bg);border-radius:16px;padding:12px 6px}
.stats b{display:block;font-size:30px;line-height:1.1;font-weight:800}
.stats span{font-size:13px;color:var(--soft)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 0}
.vs .side{background:var(--bg);border-radius:18px;padding:12px 8px;border:2px solid transparent}
.vs .side.best{border-color:var(--mint-d);background:#f1f9f1}
.vs .side .av{width:46px;height:46px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden}
.vs .side .av svg{width:100%;height:100%}
.vs .side b{display:block;font-size:28px;font-weight:800}
.vs .side small{color:var(--soft);font-size:13px}
.vs .mid{font-weight:800;color:var(--soft)}
.review{text-align:left;max-height:230px;overflow:auto;background:var(--bg);border-radius:16px;padding:6px 12px;margin:8px 0;list-style:none}
.review li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.review li:last-child{border-bottom:0}
.review .av{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--c)}
.review .q{font-weight:800;font-size:14px}
.review .bad{color:#c0607e;text-decoration:line-through;font-size:14px}
.review .good{color:#3f8a4c;font-weight:700;font-size:14px}
.review .tip{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.newbest{display:inline-block;background:linear-gradient(120deg,#ffe08a,#ffb98f);padding:4px 14px;border-radius:999px;font-weight:800;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.conf{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:20;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- phone ---------- */
@media(max-width:760px){
  #answers{grid-template-columns:1fr;gap:8px}
  .ans{min-height:50px;font-size:16px;padding:9px 12px 9px 46px;border-radius:20px 20px 20px 6px}
  .ans .k{width:26px;height:26px;left:10px}
  #say{transform-origin:50% 100%;padding:12px 16px 14px;border-radius:22px}
  #say::before{left:50%;top:auto;bottom:-11px;margin-left:-10px;transform:rotate(-45deg)}
  #line{font-size:20px;margin-top:6px}
  #lineEn{font-size:14px}
  .hud{gap:7px;padding:10px 12px}
  .pill{padding:5px 11px 5px 6px;gap:6px}
  .pill b{font-size:18px}
  .how{grid-template-columns:1fr;gap:6px}
  .how div{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 12px}
  .how b{margin:0;font-size:20px}
  .tlab{display:none}
  .bell{left:calc(100% + 16px)}
  .ftag{bottom:calc(100% + 18px)}
  #panel{padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px))}
  .trow{margin-bottom:8px}
  .card{padding:20px 18px 18px}
}
@media(max-width:420px){.duo .pill .pn,.pill.fox .pn{display:none}.names{grid-template-columns:1fr}#rd svg{display:none}}
@media(max-width:760px){.lamp,.ftag{display:none}}
@media(max-height:620px) and (min-width:761px){.ans{min-height:48px;padding-top:8px;padding-bottom:8px}}
@media(prefers-reduced-motion:reduce){.win i,.plant,.faces .f,.newbest{animation:none!important}.door,.who{transition-duration:.01s!important}}
</style>

function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function banner(t,sub){const w=$('#wave');w.innerHTML=t+(sub?`<small>${sub}</small>`:'');w.classList.remove('show');void w.offsetWidth;w.classList.add('show')}

/* ---------- game flow ---------- */
function start(){
  gid++;
  const rounds=[];
  ORDER.forEach((k,vi)=>['o','m','c'].forEach((part,li)=>{const pool=D[k][part];rounds.push({k,vi,li,it:pool[Math.random()*pool.length|0]})}));
  const pl=(mode==='cpu'?[names[0]]:names).map(n=>({name:n,score:0,correct:0,n:0,streak:0,bestStreak:0,wins:0,fast:[]}));
  G={rounds,ri:-1,players:pl,cpu:mode==='cpu'?{score:0,correct:0,wins:0}:null,wrong:[],state:'idle',el:0,paused:false,over:false,cur:0};
  ['#startOv','#endOv','#pauseOv'].forEach(s=>$(s).classList.remove('show'));
  $('#hint').classList.remove('show');$('#rres').classList.remove('show');$('#say').classList.remove('show');
  $('#answers').innerHTML='';$('#answers').classList.add('wait');
  setPlayerColor(0);setupHud();hud();layout();
  visit(0,true);
}
async function visit(vi,first){
  const k=ORDER[vi],n=N[k];
  G.state='walk';
  const Ld=$('#landing'),Dc=$('#deco');
  if(!first&&!reduced){
    const ease='cubic-bezier(.5,0,.75,.3)';
    Ld.animate([{transform:'none',opacity:1},{transform:'translateY(75%)',opacity:0}],{duration:650,easing:ease,fill:'forwards'});
    Dc.animate([{transform:'none'},{transform:'translateY(45%)'}],{duration:650,easing:ease,fill:'forwards'});
    [0,.16,.32,.48].forEach((d,i)=>beep(110+i*14,.06,'triangle',.08,d));
    await wait(650);
  }
  setAccent(k);
  $('#photo').style.setProperty('--py',(100-vi*20)+'%');
  $('#ftag').innerHTML=`${n.floor}<span class="e">${n.floorEn}</span>`;
  $('#plate').textContent=n.plate;
  $('#dw').classList.remove('open');
  const who=$('#who');who.className='who';who.innerHTML=pic(k);
  if(!reduced){
    Ld.animate([{transform:'translateY(-55%)',opacity:0},{transform:'none',opacity:1}],{duration:800,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
    Dc.animate([{transform:'translateY(-45%)'},{transform:'none'}],{duration:800,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
  }
  banner(n.floor,`${n.nm} · ${n.role}`);
  await wait(reduced?200:900);
  const b=$('#bell');b.classList.remove('ring');void b.offsetWidth;b.classList.add('ring');
  beep(784,.4,'sine',.07);beep(622,.6,'sine',.07,.34);
  await wait(800);
  $('#dw').classList.add('open');beep(220,.25,'triangle',.03);beep(180,.3,'triangle',.025,.12);
  await wait(reduced?100:950);
  ask();
}
async function ask(){
  G.ri++;
  const r=G.rounds[G.ri],it=r.it,n=N[r.k],g=gid;
  G.cur=mode==='2p'?G.ri%2:0;
  const p=G.players[G.cur];
  setPlayerColor(G.cur);
  $('#s0').classList.toggle('on',G.cur===0);$('#s1').classList.toggle('on',!G.cpu&&G.cur===1);
  $('#turnT').innerHTML=G.cpu?`Du bist dran<span class="e">your turn</span>`:`${esc(p.name)} ist dran<span class="e">${esc(p.name)}'s turn</span>`;
  hud();
  $('#rres').classList.remove('show');$('#hint').classList.remove('show');
  const tm=$('#timer');tm.classList.remove('late');tm.style.setProperty('--t',1);$('#cpum').className='cpum';$('#tlab').textContent='';
  $('#answers').classList.add('wait');
  if(mode==='2p'&&G.ri>0)banner(esc(p.name),'ist dran · your turn');
  /* bubble */
  const say=$('#say');
  if(r.li===0||!say.classList.contains('show')){say.classList.remove('show');void say.offsetWidth}
  $('#snm').textContent=n.nm;$('#srole').innerHTML=`${n.role}<span class="e ei"> · ${n.roleEn}</span>`;
  const ds=$('#ds');ds.textContent=n.sie?'Sie':'du';ds.classList.remove('show');
  $('#lineEn').textContent=it.se;$('#line').textContent='';
  say.classList.add('show');
  if(r.li>0&&!reduced)say.animate([{transform:'scale(.97)'},{transform:'scale(1.02)'},{transform:'none'}],{duration:350});
  beep(n.sie?440:560,.08,'sine',.04);beep(n.sie?520:660,.08,'sine',.035,.08);
  if(reduced)$('#line').textContent=it.s;
  else for(let i=1;i<=it.s.length;i++){$('#line').textContent=it.s.slice(0,i);await wait(16);if(g!==gid)return}
  /* answers */
  const opts=shuffle(it.a.map((a,i)=>({de:a[0],en:a[1],h:a[2],he:a[3],ok:i===0})));
  G.opts=opts;
  $('#answers').innerHTML=opts.map((o,i)=>`<button class="ans in" data-i="${i}" data-ok="${o.ok?1:0}"><span class="k">${i+1}</span>${esc(o.de)}${E(esc(o.en))}</button>`).join('');
  $('#answers').querySelectorAll('.ans').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)));
  $('#answers').classList.remove('wait');
  if(G.cpu){const d=DIFF[diff];G.cpuT=d.t[0]+Math.random()*(d.t[1]-d.t[0]);G.cpuOk=Math.random()<d.acc}
  G.el=0;G.cpuShown=false;G.tick=6;G.state='ask';
}
const ptsFor=t=>t>TIME?30:Math.round((40+60*(1-t/TIME))/5)*5;

function choose(i){
  if(!G||G.state!=='ask'||G.paused)return;
  G.state='reveal';
  const o=G.opts[i],t=G.el,p=G.players[G.cur],r=G.rounds[G.ri],n=N[r.k];
  const btns=[...$('#answers').querySelectorAll('.ans')];
  btns.forEach(b=>b.disabled=true);
  const ci=G.opts.findIndex(x=>x.ok);
  p.n++;
  let pts=0;
  if(o.ok){
    p.streak++;p.bestStreak=Math.max(p.bestStreak,p.streak);p.correct++;p.fast.push(t);
    pts=ptsFor(t)+(p.streak>=3?10:0);p.score+=pts;
    btns[i].classList.add('right');btns.forEach((b,j)=>{if(j!==i)b.classList.add('dim')});
    react(true);plink(Math.min(p.streak,6));
    const br=btns[i].getBoundingClientRect();floatTxt(br.left+br.width/2,br.top-6,`+${pts}`,'#3f8a4c');
    if(p.streak===3)setTimeout(()=>banner('Serie x3!','+10 Bonus pro Antwort · bonus per answer'),250);
    if(p.streak===6)setTimeout(()=>banner('Super Nachbar!','6 richtig in Folge · 6 in a row'),250);
  }else{
    p.streak=0;
    btns[i].classList.add('wrong');btns[ci].classList.add('right');btns.forEach((b,j)=>{if(j!==i&&j!==ci)b.classList.add('dim')});
    react(false);beep(196,.22,'sawtooth',.045);beep(147,.3,'triangle',.06,.1);
    G.wrong.push({k:r.k,s:r.it.s,se:r.it.se,pick:o,ok:G.opts[ci],who:p.name});
  }
  $('#ds').classList.add('show');
  /* computer neighbor */
  let res='',win=false;
  if(G.cpu){
    const cpts=G.cpuOk?ptsFor(G.cpuT):0;G.cpu.score+=cpts;if(G.cpuOk)G.cpu.correct++;
    const mine=o.ok?ptsFor(t):0;
    if(!G.cpuShown)showCpu();
    if(mine>cpts){p.wins++;win=true;res=`Du warst schneller als Fuchsi!${E('You beat Fuchsi to it!')}`}
    else if(cpts>mine){G.cpu.wins++;res=G.cpuOk?(o.ok?`Fuchsi war schneller.${E('Fuchsi was faster.')}`:`Fuchsi hatte recht: +${cpts}${E('Fuchsi got it right.')}`):''}
    else res=o.ok?`Gleich schnell!${E('A tie!')}`:`Fuchsi lag auch falsch.${E('Fuchsi got it wrong too.')}`;
    if(cpts)bump($('#s1'));
  }else if(o.ok){res=`${esc(p.name)}: +${pts} in ${t.toFixed(1).replace('.',',')} s${E(`answered in ${t.toFixed(1)} seconds`)}`;win=true}
  if(o.ok)bump(G.cur===0?$('#s0'):$('#s1'));
  hud();
  if(o.ok){
    const rr=$('#rres');rr.innerHTML=res;rr.classList.toggle("won",win);if(res)rr.classList.add('show');
    wait(1500).then(()=>{if(G.state==='reveal')advance()});
  }else{
    $('#htx').innerHTML=`<b>Tipp</b>${esc(o.h)}${E(esc(o.he))}${res?`<span class="cpu">${res.replace(/<span class="e">.*<\/span>/,'')}</span>`:''}`;
    $('#hint').classList.add('show');
    setTimeout(()=>{if(G&&G.state==='reveal')$('#next').focus({preventScroll:true})},50);
  }
}
function showCpu(){
  G.cpuShown=true;const m=$('#cpum');m.innerHTML=FOX;m.style.left=Math.max(0,(1-G.cpuT/TIME))*100+'%';m.className='cpum show';
  $('#tlab').textContent='Fuchsi ✓';beep(990,.05,'square',.02);
}
function react(ok){
  const w=$('#who');w.classList.remove('happy','huh');void w.offsetWidth;w.classList.add(ok?'happy':'huh');
  if(ok&&!reduced){
    const r=w.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.3,cols=['#e58f74','#e09bb3','#d9c165','#8fc495','#7fb0dc'];
    for(let k=0;k<10;k++){const s=document.createElement('span');s.className='spark';s.textContent=k%3?'✦':'♥';s.style.color=cols[k%5];s.style.left=cx+'px';s.style.top=cy+'px';document.body.appendChild(s);
      const a=-Math.PI/2+(Math.random()-.5)*2.6,d=60+Math.random()*70;
      s.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(1)`,opacity:0}],{duration:900+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>s.remove()}
  }

function floatTxt(x,y,t,c){const f=document.createElement('div');f.className='ftext';f.textContent=t;f.style.left=x+'px';f.style.top=y+'px';f.style.color=c;document.body.appendChild(f);
  f.animate([{transform:'translateY(0) scale(.6)',opacity:0},{transform:'translateY(-14px) scale(1.15)',opacity:1,offset:.25},{transform:'translateY(-60px) scale(1)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>f.remove()}

async function advance(){
  if(!G||G.state!=='reveal')return;
  G.state='walk';
  $('#hint').classList.remove('show');$('#rres').classList.remove('show');
  $('#answers').classList.add('wait');
  $('#cpum').className='cpum';$('#tlab').textContent='';$('#timer').classList.remove('late');$('#timer').style.setProperty('--t',1);
  const r=G.rounds[G.ri];
  if(r.li<2){await wait(250);ask();return}
  await wait(250);
  $('#say').classList.remove('show');
  $('#dw').classList.remove('open');beep(150,.12,'triangle',.08,.6);beep(110,.1,'square',.03,.62);
  await wait(reduced?200:1000);

}

/* ---------- timer loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G&&G.state==='ask'&&!G.paused){
    G.el+=dt;
    const tm=$('#timer');tm.style.setProperty('--t',Math.max(0,1-G.el/TIME));
    if(G.el>TIME&&!tm.classList.contains('late')){tm.classList.add('late');if(!G.cpu||G.cpuShown)$('#tlab').textContent='Zeit!'}
    if(G.el>=G.tick&&G.el<TIME){beep(1200,.03,'sine',.018);G.tick++}
    if(G.cpu&&!G.cpuShown&&G.el>=G.cpuT)showCpu();
  }
  requestAnimationFrame(loop);
}

/* ---------- end ---------- */

  $('#endCard').innerHTML=`<div class="faces">${ORDER.map(k=>`<span class="f" style="--c:${LOOK[k].bg}">${pic(k,1)}</span>`).join('')}</div>

  if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'){e.preventDefault();$('#go').click()}return}
  if($('#startOv').classList.contains('show')){if(e.key==='Enter'){e.preventDefault();$('#go').click()}return}
  if($('#endOv').classList.contains('show')){if(e.key==='Enter'){e.preventDefault();$('#again').click()}return}
  if(e.key==='Escape'||e.key==='p'){pause(!(G&&G.paused));return}
  if(!G||G.paused)return;
  const k={1:0,2:1,3:2}[e.key];
  if(k!==undefined&&G.state==='ask'){e.preventDefault();choose(k);return}
  if((e.key==='Enter'||e.key===' ')&&G.state==='reveal'&&$('#hint').classList.contains('show')){e.preventDefault();advance()}
});
$('#next').onclick=()=>advance();
$('#resume').onclick=()=>pause(false);
$('#quit').onclick=()=>{pause(false);end()};
$('#pause').onclick=()=>pause(true);
$('#snd').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔔':'🔕'};
addEventListener('blur',()=>{if(G&&!G.over&&!G.paused&&G.state!=='idle')pause(true)});
addEventListener('resize',layout);
/* English help is driven by the Fuchsdeutsch app around the game */
addEventListener('message',e=>{const m=e.data;if(m&&m.source==='fds-app'&&m.type==='en')document.body.classList.toggle('en-on',!!m.on)});

setAccent('yilmaz');
$('#who').innerHTML=pic('yilmaz');
loadImgs();renderStart();layout();
requestAnimationFrame(loop);
</script>
</body>
</html>
